[package]
name = "lattica-pq-ringct-research"
version = "0.1.0"
edition = "2021"
publish = false
description = "Isolated codecs and measurements for compact post-quantum RingCT research"

[workspace]

[dependencies]
sha3 = "=0.10.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
aes = "=0.8.4"
lattica-prover-p3 = { path = "../../lattica-prover-p3", optional = true, default-features = false, features = ["block-v2"] }
p3-field = { version = "=0.6.1", optional = true }
p3-batch-stark = { version = "=0.6.1", optional = true }
p3-air = { version = "=0.6.1", optional = true }
p3-uni-stark = { version = "=0.6.1", optional = true }
p3-keccak-air = { version = "=0.6.1", optional = true }
p3-matrix = { version = "=0.6.1", optional = true }
p3-goldilocks = { version = "=0.6.1", optional = true }
p3-poseidon2-air = { version = "=0.6.1", optional = true }
p3-symmetric = { version = "=0.6.1", optional = true }

[dev-dependencies]
# Already locked transitively through lattica-prover-p3; diagnostic proof bytes only.
postcard = { version = "=1.1.3", features = ["alloc"] }
p3-commit = "=0.6.1"

[patch.crates-io]
p3-lookup = { path = "../../lattica-prover-p3/vendor/p3-lookup" }
p3-field = { path = "../../lattica-prover-p3/vendor/p3-field" }
p3-symmetric = { path = "../../lattica-prover-p3/vendor/p3-symmetric" }

[features]
# Test-only allocation census; use without the core stream allocator.
native-verification-allocation-audit = ["recursive-wide"]
# Explicit full-column diagnostic readback; off in production builds.
native-trace-audit = ["opencl", "lattica-prover-p3/native-trace-audit"]
default = []
native-matrict = []
# Explicit deterministic private diagnostics; never enable in production.
native-spend-oracle = ["native-matrict", "opencl", "lattica-prover-p3/native-spend-oracle"]
recursive = ["dep:lattica-prover-p3", "dep:p3-field", "dep:p3-batch-stark", "dep:p3-air", "dep:p3-uni-stark", "dep:p3-keccak-air", "dep:p3-matrix", "dep:p3-goldilocks", "dep:p3-poseidon2-air", "dep:p3-symmetric"]
recursive-wide = ["recursive", "lattica-prover-p3/block-v2-wide-lanes"]
metadata-screen = ["recursive-wide", "lattica-prover-p3/verifier-metadata-screen"]
# Explicit research selection only. Compiling this feature does not initialize a GPU.
opencl = ["recursive-wide", "lattica-prover-p3/gpu"]

[[bin]]
name = "pq-ringct-opencl-probe"
path = "src/bin/pq_ringct_opencl_probe.rs"
required-features = ["opencl"]

[[bin]]
name = "pq-ringct-registration-metadata-screen"
path = "src/bin/pq_ringct_registration_metadata_screen.rs"
required-features = ["metadata-screen"]
