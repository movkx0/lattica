# Production spend circuit on Plonky3 (transparent, FRI, zero-knowledge via the hiding PCS).
# Goldilocks field + vetted Poseidon2 (constants + AIR from p3-*). Built on stable Rust.
# Replaces the Winterfell `lattica-prover` for production; that crate is kept as a differential
# oracle. See docs/framework-decision.md.
[package]
name = "lattica-prover-p3"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
name = "lattica_prover_p3"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "lattica-prover-p3"
path = "src/main.rs"

[[bin]]
name = "block-v2-feasibility"
path = "src/bin/block_v2_feasibility.rs"
required-features = ["block-v2", "recursion"]

[[bin]]
name = "block-v2-execution-probe"
path = "src/bin/block_v2_execution_probe.rs"
required-features = ["block-v2"]

[[bin]]
name = "block-v2-cpu-worker"
path = "src/bin/block_v2_cpu_worker.rs"
required-features = ["block-v2", "stream"]

[[bin]]
name = "block-v2-recursion-probe"
path = "src/bin/block_v2_recursion_probe.rs"
required-features = ["block-v2", "stream"]

[[bin]]
name = "block-v2-artifact-audit"
path = "src/bin/block_v2_artifact_audit.rs"
required-features = ["block-v2"]

[[bin]]
name = "block-v2-grouped-probe"
path = "src/bin/block_v2_grouped_probe.rs"
required-features = ["block-v2", "stream"]

[[bin]]
name = "block-v2-grouped-artifact-audit"
path = "src/bin/block_v2_grouped_artifact_audit.rs"
required-features = ["block-v2"]

[[bin]]
name = "block-v2-gpu-grouped-probe"
path = "src/bin/block_v2_gpu_grouped_probe.rs"
required-features = ["block-v2-wide-lanes", "stream", "gpu"]

[[bin]]
name = "block-v2-metal-grouped-probe"
path = "src/bin/block_v2_metal_grouped_probe.rs"
required-features = ["block-v2-wide-lanes", "stream", "gpu-metal"]

[[bin]]
name = "block-v2-grouped-publics"
path = "src/bin/block_v2_grouped_publics.rs"
required-features = ["block-v2", "stream"]

[[bin]]
name = "block-v2-four-wallet-geometry"
path = "src/bin/block_v2_four_wallet_geometry.rs"
required-features = ["block-v2-wide-lanes", "stream"]

[[bin]]
name = "block-v2-single-eight-probe"
path = "src/bin/block_v2_single_eight_probe.rs"
required-features = ["block-v2", "stream"]

[[bin]]
name = "block-v2-padding-probe"
path = "src/bin/block_v2_padding_probe.rs"
required-features = ["block-v2", "stream"]

[[bin]]
name = "block-v2-typed-probe"
path = "src/bin/block_v2_typed_probe.rs"
required-features = ["block-v2", "stream"]

[[bin]]
name = "block-v2-finalized-probe"
path = "src/bin/block_v2_finalized_probe.rs"
required-features = ["block-v2", "stream"]

[[bin]]
name = "apple-field-bench"
path = "src/bin/apple_field_bench.rs"
required-features = ["cpu-sme2"]

[[bin]]
name = "block-v2-paired-probe"
path = "src/bin/block_v2_paired_probe.rs"
required-features = ["block-v2", "stream"]

[dependencies]
itertools = "0.14"
serde_json = "1"
p3-air = "0.6.1"
p3-field = "0.6.1"
p3-goldilocks = "0.6.1"
p3-poseidon2 = "0.6.1"
p3-poseidon2-air = { version = "0.6.1", features = ["parallel"] }
p3-symmetric = "0.6.1"
p3-challenger = "0.6.1"
p3-commit = "0.6.1"
p3-dft = { version = "0.6.1", features = ["parallel"] }
p3-fri = "0.6.1"
p3-matrix = "0.6.1"
p3-merkle-tree = "0.6.1"
p3-uni-stark = { version = "0.6.1", features = ["parallel"] }
p3-batch-stark = { version = "=0.6.1", optional = true, features = ["parallel"] }
p3-lookup = { version = "=0.6.1", optional = true }
tracing = { version = "0.1.44", optional = true }
p3-baby-bear = "0.6.1"
rand = "0.10"
rand_chacha = "0.10"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
# GPU-accelerated proving: OpenCL DFT/LDE, included by the default `gpu` feature.
ocl = { version = "0.19", optional = true }
rayon = { version = "1", optional = true } # parallelize the GPU leaf-buffer marshalling
libc = { version = "0.2", optional = true } # streaming allocator and research filesystem safeguards
p3-util = { version = "0.6.1", optional = true } # streaming FRI fork: p3's exact log2_strict_usize / reverse_slice_index_bits
p3-maybe-rayon = { version = "0.6.1", optional = true, features = ["parallel"] } # streaming open: SIMD-parallel off-disk reduction

[dev-dependencies]
rayon = "1" # streaming FRI test: pin a 1-thread pool so p3's `find_map_any` PoW grind is deterministic

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-metal = { version = "0.3.2", optional = true }

[features]

# Isolated exact-integer component experiment; does not select a prover backend.
cpu-sme2 = ["dep:libc"]
# Include the GPU backend in standard builds. Use --no-default-features for CPU-only builds.
default = ["gpu"]
# Enable GPU (OpenCL) acceleration of the LDE. Proving calls select the GPU backend explicitly.
# Requires an OpenCL runtime + a GPU when used; the wire format and verifier are unchanged.
gpu = ["dep:ocl", "dep:rayon", "dep:libc", "dep:p3-util"]
gpu-metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal", "dep:rayon", "dep:libc", "dep:p3-util"]
# Enable the RESEARCH in-circuit recursive STARK verifier (`src/recursion`: the monolith + aggregator). OFF by
# default — it is NOT on any production path (zero default `lattica_*` externs reach it) and is NOT audited;
# gating it out keeps the default staticlib to the frozen node seam. Its ~80 `#[ignore]` tests + the 2 monolith
# constraint-fingerprint pins compile only under this feature. Run with `--features recursion`.
recursion = []
# Candidate block-proof profile and feasibility tools ONLY. No C ABI, node acceptance,
# or production activation. Does not change the historical proof configuration.
block-v2 = ["dep:p3-batch-stark", "dep:p3-lookup", "dep:tracing", "dep:libc", "dep:rayon"]
# Structural research only: a different single-table AIR and registry identity.
# Never use this build with legacy candidate keys or as a measured-series runner.
# No production ABI/activation. Native validation and recursive closure are separate gates.
block-v2-wide-lanes = ["block-v2"]
# Versioned research host verification. No legacy verifier fallback or activation.
block-v2-host = ["block-v2-wide-lanes"]
# Enable the RESEARCH out-of-core (streaming) prover: a `#[global_allocator]` that spills large
# allocations (the trace/quotient/Merkle LDE) to a memory-mapped file on NVMe, bounding the prover's
# peak RSS under a cgroup ceiling instead of holding the whole LDE in RAM. Additive + prove-only +
# BYTE-IDENTICAL (only the backing store changes); OFF by default so the production staticlib and the
# default externs never install it. Run with `--features stream`. See `src/spill_alloc.rs`.
stream = ["dep:libc", "dep:p3-util", "dep:p3-maybe-rayon"]

[profile.release]
# Cross-crate inlining of p3's hot field-arithmetic / NTT / Poseidon2 loops (thin LTO + one codegen
# unit). Longer compile, faster prover; results bit-identical.
lto = "thin"
codegen-units = 1
