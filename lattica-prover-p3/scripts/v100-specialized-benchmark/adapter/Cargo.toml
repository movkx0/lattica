[package]
name = "v100-specialized-bench"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
default = []
gpu = ["lattica-prover-p3/gpu-tuning"]

[dependencies]
lattica-prover-p3 = { path = "../../..", default-features = false, features = ["block-v2-wide-lanes", "stream"] }
p3-field = "0.6.1"
p3-goldilocks = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
postcard = { version = "1", features = ["alloc"] }

[patch.crates-io]
p3-lookup = { path = "../../../vendor/p3-lookup" }
p3-field = { path = "../../../vendor/p3-field" }
p3-symmetric = { path = "../../../vendor/p3-symmetric" }

[profile.release]
lto = "thin"
codegen-units = 1
